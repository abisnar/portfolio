name: Deploy (AWS)

# Site now ships to GitHub Pages (see pages.yml). This AWS S3/CloudFront +
# Lambda pipeline is kept for reference and runs only on manual dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Backend: install, test, build, upload zips
      - name: Backend install + test
        working-directory: backend
        run: |
          npm ci
          npm test
          npm run build

      - name: Update Lambda functions
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_TRACK_FUNCTION }}" \
            --zip-file "fileb://backend/dist/track.zip" \
            --publish > /dev/null
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_STATS_FUNCTION }}" \
            --zip-file "fileb://backend/dist/stats.zip" \
            --publish > /dev/null

      # Frontend: install, test, build with API endpoint, sync to S3, invalidate
      - name: Frontend install + test + build
        working-directory: frontend
        env:
          VITE_API_ENDPOINT: ${{ vars.API_ENDPOINT }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${{ vars.FRONTEND_BUCKET }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html "s3://${{ vars.FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" > /dev/null
